
# Common configuration settings
[common]
	# Allows every player to use any backpack cosmetic variant without needing to complete the challenges. Side note, any progress to a challenge will not be tracked while enabled.
	# Valid values: true, false
	unlockAllBackpacks = false
	# If enabled, allows players to access the backpack of another player by interacting with the visible backpack on their back.
	# Valid values: true, false
	pickpocketBackpacks = false
	# If enabled, prevents backpacks from being customised. This will remove the customise button from the backpack inventory
	# Valid values: true, false
	disableCustomisation = false
	# When breaking a shelf, the placed backpack will also drops it's items into the world. This prevents players from carrying multiple backpacks
	# Valid values: true, false
	dropContentsFromShelf = true
	# A list of items that are not allowed inside a backpack. Note: It is recommended to ban items that have an inventory as this will create large NBT data and potentially crash the server!
	bannedItems = ["butcher:dolphincorpseitem", "butcher:camelcarcassitem", "butcher:elderguardiancorpse", "butcher:white_llama", "butcher:withercorpse", "butcher:end_dragon_corpse", "butcher:polarbear_corpse_item", "butcher:panda", "butcher:pig_corpse_item", "butcher:cowcorpseitem", "butcher:sheep_corpse_item", "butcher:brown_llama", "butcher:villager_corpse_item", "butcher:squidcorpse", "butcher:foxcorpseitem", "butcher:gray_llama", "travelersbackpack:custom_travelers_backpack", "pinesbarrels:better_barrel", "quark:seed_pouch", "quark:backpack", "sophisticatedbackpacks:backpack", "sophisticatedbackpacks:iron_backpack", "sophisticatedbackpacks:gold_backpack", "sophisticatedbackpacks:diamond_backpack", "sophisticatedbackpacks:netherite_backpack", "improvedbackpacks:tiny_pocket", "improvedbackpacks:medium_pocket", "improvedbackpacks:large_pocket", "improvedbackpacks:white_backpack", "improvedbackpacks:orange_backpack", "improvedbackpacks:magenta_backpack", "improvedbackpacks:light_blue_backpack", "improvedbackpacks:yellow_backpack", "improvedbackpacks:lime_backpack", "improvedbackpacks:pink_backpack", "improvedbackpacks:gray_backpack", "improvedbackpacks:light_gray_backpack", "improvedbackpacks:cyan_backpack", "improvedbackpacks:purple_backpack", "improvedbackpacks:blue_backpack", "improvedbackpacks:brown_backpack", "improvedbackpacks:green_backpack", "improvedbackpacks:red_backpack", "improvedbackpacks:black_backpack", "immersiveengineering:toolbox", "immersiveengineering:crate", "immersiveengineering:reinforced_crate", "create:white_toolbox", "create:orange_toolbox", "create:magenta_toolbox", "create:light_blue_toolbox", "create:yellow_toolbox", "create:lime_toolbox", "create:pink_toolbox", "create:gray_toolbox", "create:light_gray_toolbox", "create:cyan_toolbox", "create:purple_toolbox", "create:blue_toolbox", "create:brown_toolbox", "create:green_toolbox", "create:red_toolbox", "create:black_toolbox", "mekanism:personal_chest", "supplementaries:sack"]
	# Stops players from removing the backpack if it's not empty. This prevents players from carrying multiple backpacks.
	# Valid values: true, false
	lockBackpackIntoSlot = true
	# When picking up a backpack (with items inside) off the ground, the item will automatically equip. Having this enabled may not be ideal for multiplayer servers.
	# Valid values: true, false
	autoEquipBackpackOnPickup = false
	# The maximum reach distance of a player to interact with another player's backpack.
	# Valid range: 0 to 4 (inclusive)
	pickpocketDistance = 2.0
	# The maximum angle at which another player's backpack can be accessed
	# Valid range: 0 to 90 (inclusive)
	pickpocketMaxRangeAngle = 80.0

